name: Telegram Schedule Bot

on:
  schedule:
    # Mỗi ngày 22:47 UTC = 05:47 sáng giờ VN (hôm sau).
    # Tránh mốc tròn giờ vì GitHub hay trễ 10–30 phút lúc đó -> tin tới khoảng 6h.
    - cron: '47 22 * * *'
  workflow_dispatch:
    inputs:
      che_do:
        description: 'auto = tự chọn theo thứ; tuan = gửi bản thứ Hai; ngay = bản ngày thường'
        type: choice
        default: auto
        options: [auto, tuan, ngay]

# Không cho 2 lần chạy chồng nhau (vd: bấm tay đúng lúc cron chạy).
concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      # Bản lưu lịch (dùng khi web trường lỗi), lịch thi đã báo, học phí lần trước.
      # Bot chạy mỗi ngày nên cache luôn được dùng, không bị GitHub xóa.
      - name: Khôi phục trạng thái
        uses: actions/cache/restore@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run Bot
        env:
          TELE_BOT_TOKEN: ${{ secrets.TELE_BOT_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
          MSV: ${{ secrets.MSV }}
          PASS_TRUONG: ${{ secrets.PASS_TRUONG }}
        run: python bot_telegram.py "${{ inputs.che_do || 'auto' }}"

      - name: Lưu trạng thái
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bot_state
          key: bot-state-${{ github.run_id }}
