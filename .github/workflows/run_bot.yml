name: Zalo Schedule Bot

on:
  schedule:
    - cron: '0 23 * * *' # 6h sáng VN
  workflow_dispatch: # Để mình bấm nút chạy thử luôn

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Run Bot
        run: python bot_zalo.py
